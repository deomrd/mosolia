# Construit l'APK Mosolia sur les serveurs de GitHub, sans Android Studio ni terminal.
# Resultat : onglet "Actions" du depot > la derniere execution > "Artifacts" > mosolia-apk.
name: APK Android Mosolia

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Construire l'APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Nommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk mosolia.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mosolia-apk
          path: android/mosolia.apk
